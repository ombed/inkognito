name: test

# Every PR and every push to main: the Node suites, the browser checks, the deterministic benchmark and its
# gate; and, beside them, the model-on benchmark. The weights are in the repository (models/, since v56) and
# the bench reads them locally, so nothing is downloaded; the model-on gate reports only until its baseline
# has held on CI's machines (outside review of 12.10).
#
# The baseline both gates compare with is the one at the PR's base, or main before the push, read with
# git show (GATE_BASE_REF, bench/gate.js): a change cannot pass by regenerating its own baseline. What it
# accepts as worse is named, with a reason, in bench/gate-accepted.json.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Node suites and browser checks
        run: npm test
      - name: Benchmark, deterministic layers
        run: npm run bench:nomodel
      - name: The baseline's commit (the PR's base, or main before this push)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            echo "GATE_BASE_REF=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          elif git fetch --no-tags --depth=1 origin "$BEFORE"; then
            echo "GATE_BASE_REF=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          else
            echo "::warning::gate: the commit before this push could not be fetched; comparing with the pushed baseline"
          fi
      # Blocking since v18 (decision Q7 in docs/PLAN-v18.md): a PR that makes any entity worse fails until it is
      # fixed, or until bench/gate-accepted.json names the entity with a reason (since 12.10).
      - name: Recall gate
        run: node bench/gate.js
        env:
          GATE_BLOCKING: "1"
      # What the change does to the output itself (12.10): the deterministic layers' text for each document of the
      # synthetic corpus must equal bench/golden/, so an engine change shows its output, line by line, in the PR
      - name: Output against bench/golden
        if: always()
        run: node bench/golden.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  bench-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Benchmark, with the model
        run: npm run bench
      - name: The baseline's commit (the PR's base, or main before this push)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            echo "GATE_BASE_REF=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          elif git fetch --no-tags --depth=1 origin "$BEFORE"; then
            echo "GATE_BASE_REF=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          fi
      # Report only for now: CI's processors may round the model's scores differently from the machine the
      # baseline was made on. Blocking once a few runs show it holds.
      - name: Recall gate, model on
        run: node bench/gate.js --model
      # The figures README quotes from the blind test (tests/protocol.txt, locked in bench/protocol.lock.json) are
      # measured on every change, and bench/protocol-claims.js fails when README and the measurement differ (12.10).
      - name: The blind test, and the figures README quotes from it
        if: always()
        run: |
          npm run -s bench:protocol -- --json bench/protocol-result.json
          node bench/protocol-claims.js bench/protocol-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-model
          path: |
            bench/results.json
            bench/results.md
            bench/protocol-result.json
          retention-days: 14
